<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pasa la bomba</title>
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Todos los textos se rellenan desde js/i18n.js mediante el atributo data-i18n -->
  <main>
    <!-- Pantalla de inicio -->
    <section id="screen-home" class="card" aria-labelledby="home-title">
      <h1 id="home-title" tabindex="-1" data-i18n="title"></h1>
      <p class="tagline" data-i18n="tagline"></p>

      <form id="form-home" novalidate>
        <label for="name" data-i18n="name_label"></label>
        <input id="name" type="text" maxlength="12" autocomplete="nickname">

        <fieldset class="map-picker">
          <legend data-i18n="map_title"></legend>
          <label class="map-option forest-option"><input type="radio" name="theme" value="forest" checked><span data-i18n="map_forest"></span></label>
          <label class="map-option desert-option"><input type="radio" name="theme" value="desert"><span data-i18n="map_desert"></span></label>
          <label class="map-option ruins-option"><input type="radio" name="theme" value="ruins"><span data-i18n="map_ruins"></span></label>
        </fieldset>

        <fieldset class="mode-picker">
          <legend data-i18n="mode_title"></legend>
          <label class="mode-option"><input type="radio" name="mode" value="bomb" checked><span class="mode-copy"><strong data-i18n="mode_bomb"></strong><small data-i18n="mode_bomb_desc"></small></span></label>
          <label class="mode-option"><input type="radio" name="mode" value="coinRush"><span class="mode-copy"><strong data-i18n="mode_coin_rush"></strong><small data-i18n="mode_coin_rush_desc"></small></span></label>
        </fieldset>

        <button type="button" id="btn-create" class="primary" data-i18n="create_room"></button>

        <p class="separator" data-i18n="or_join"></p>

        <label for="code" data-i18n="code_label"></label>
        <div class="row">
          <input id="code" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false">
          <button type="submit" id="btn-join" data-i18n="join_room"></button>
        </div>
      </form>
      <p id="error" class="error" role="alert"></p>

      <h2 data-i18n="how_title"></h2>
      <ul class="how">
        <li data-i18n="how_1"></li>
        <li data-i18n="how_2"></li>
        <li data-i18n="how_bomb_types"></li>
        <li>
          <span data-i18n="how_3"></span>
          <ul class="legend">
            <li><img data-icon="trap" alt=""><span data-i18n="gadget_desc_trap"></span></li>
            <li><img data-icon="gum" alt=""><span data-i18n="gadget_desc_gum"></span></li>
            <li><img data-icon="boost" alt=""><span data-i18n="gadget_desc_boost"></span></li>
          </ul>
        </li>
        <li data-i18n="how_4"></li>
        <li data-i18n="how_5"></li>
      </ul>
    </section>

    <!-- Sala de espera -->
    <section id="screen-lobby" class="card" aria-labelledby="lobby-title" hidden>
      <h1 id="lobby-title" tabindex="-1" data-i18n="lobby_title"></h1>
      <p class="code-line"><span data-i18n="room_code"></span> <strong id="lobby-code"></strong></p>
      <p class="room-theme"><span data-i18n="room_map"></span> <strong id="lobby-theme"></strong></p>

      <fieldset id="lobby-map-picker" class="map-picker lobby-map-picker">
        <legend data-i18n="map_lobby_title"></legend>
        <label class="map-option forest-option"><input type="radio" name="lobby-theme" value="forest"><span data-i18n="map_forest"></span></label>
        <label class="map-option desert-option"><input type="radio" name="lobby-theme" value="desert"><span data-i18n="map_desert"></span></label>
        <label class="map-option ruins-option"><input type="radio" name="lobby-theme" value="ruins"><span data-i18n="map_ruins"></span></label>
      </fieldset>

      <fieldset id="lobby-mode-picker" class="mode-picker">
        <legend data-i18n="mode_lobby_title"></legend>
        <label class="mode-option"><input type="radio" name="lobby-mode" value="bomb"><span class="mode-copy"><strong data-i18n="mode_bomb"></strong><small data-i18n="mode_bomb_desc"></small></span></label>
        <label class="mode-option"><input type="radio" name="lobby-mode" value="coinRush"><span class="mode-copy"><strong data-i18n="mode_coin_rush"></strong><small data-i18n="mode_coin_rush_desc"></small></span></label>
      </fieldset>

      <fieldset class="skin-picker">
        <legend data-i18n="skin_title"></legend>
        <label for="lobby-shape" data-i18n="skin_shape_label"></label>
        <select id="lobby-shape">
          <option value="circle" data-i18n="shape_circle"></option>
          <option value="square" data-i18n="shape_square"></option>
          <option value="triangle" data-i18n="shape_triangle"></option>
          <option value="diamond" data-i18n="shape_diamond"></option>
          <option value="star" data-i18n="shape_star"></option>
          <option value="hexagon" data-i18n="shape_hexagon"></option>
          <option value="cross" data-i18n="shape_cross"></option>
          <option value="pentagon" data-i18n="shape_pentagon"></option>
        </select>
        <label for="lobby-color" data-i18n="skin_color_label"></label>
        <input id="lobby-color" type="color" value="#ff6b6b">
      </fieldset>

      <label for="share-url" data-i18n="share_label"></label>
      <div class="row">
        <input id="share-url" type="text" readonly aria-describedby="share-note">
        <button type="button" id="btn-copy" data-i18n="copy"></button>
      </div>
      <p id="share-note" class="note"></p>

      <h2 id="lobby-count"></h2>
      <ul id="lobby-players" class="players"></ul>

      <p id="lobby-status" class="status"></p>
      <p id="lobby-error" class="error" role="alert"></p>
      <div class="row">
        <button type="button" id="btn-start" class="primary" data-i18n="start_game"></button>
        <button type="button" id="btn-leave" data-i18n="leave"></button>
      </div>
    </section>

    <!-- Partida -->
    <section id="screen-game" aria-labelledby="game-title" hidden>
      <h1 id="game-title" class="sr-only" tabindex="-1" data-i18n="game_title"></h1>
      <canvas id="canvas" role="img" data-i18n-label="canvas_label"></canvas>
      <p id="banner" class="banner"></p>
      <ul id="hud" class="players hud" data-i18n-label="scoreboard"></ul>
      <p id="toast" class="toast" hidden></p>
      <div id="sprint" class="sprint">
        <span class="sprint-text"><strong data-i18n="sprint_label"></strong> <span id="sprint-state"></span></span>
        <span class="sprint-bar" aria-hidden="true"><span id="sprint-fill"></span></span>
      </div>
      <div class="hint">
        <p id="hint" data-i18n="controls_hint"></p>
        <ul class="legend">
          <li><img data-icon="trap" alt=""><span data-i18n="gadget_trap"></span></li>
          <li><img data-icon="gum" alt=""><span data-i18n="gadget_gum"></span></li>
          <li><img data-icon="boost" alt=""><span data-i18n="gadget_boost"></span></li>
          <li><span class="pond-swatch" aria-hidden="true"></span><span data-i18n="pond_legend"></span></li>
        </ul>
      </div>
    </section>

    <!-- Resultados -->
    <section id="screen-results" class="card" aria-labelledby="results-title" hidden>
      <h1 id="results-title" tabindex="-1"></h1>
      <h2 data-i18n="results_stats_title"></h2>
      <ul id="result-stats" class="players results-stats"></ul>
      <h2 data-i18n="awards_title"></h2>
      <ul id="result-awards" class="award-list"></ul>
      <h2 data-i18n="ranking"></h2>
      <ol id="ranking" class="players"></ol>
      <p><a id="api-link" target="_blank" rel="noopener" data-i18n="api_link"></a></p>
      <p id="results-status" class="status"></p>
      <div class="row">
        <button type="button" id="btn-again" class="primary" data-i18n="play_again"></button>
        <button type="button" id="btn-leave2" data-i18n="leave"></button>
      </div>
    </section>
  </main>

  <!-- Anuncios para lectores de pantalla -->
  <div id="live" class="sr-only" aria-live="polite"></div>

  <script src="socket.io/socket.io.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
